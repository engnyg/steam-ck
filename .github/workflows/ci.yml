name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds the native OpenSteamTool engine on a runner that has the full
  # Windows SDK (rc.exe/mt.exe) + MSVC toolchain, which local dev boxes may lack.
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build engine
        shell: pwsh
        run: ./build-engine.ps1

      - name: Upload engine binaries
        uses: actions/upload-artifact@v4
        with:
          name: engine-dlls
          path: src/OpenSteamUnlocker.App/engine/*.dll

  # Builds the WPF app, bundling the engine DLLs produced above.
  app:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download engine binaries
        uses: actions/download-artifact@v4
        with:
          name: engine-dlls
          path: src/OpenSteamUnlocker.App/engine

      - name: Build solution
        run: dotnet build OpenSteamUnlocker.sln -c Release

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/OpenSteamUnlocker.App/OpenSteamUnlocker.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OpenSteamUnlocker
          path: publish
